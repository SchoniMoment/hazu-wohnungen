<!DOCTYPE html>
<html lang="de">
<head>

<body>

<div class="eb-categories"></div>
<script src="https://www.easy-booking.at/ebPlugins/categories_v2/jquery.easybooking.categories.js"></script>
<script type="text/javascript">
	function ebCategoriesLoadedCheck() {
		if (typeof jQuery != "undefined") {
			var data = ({
				customerId: 11803,
				serialNo: "2107-3738-2369",
				localeId: 2,
				localeName: "de",
				templateId: 1,
				templateURL: "//easy-booking.at/ebPlugins/categories_v2/tpl/1/index.html",
				maxImgWidth: 960,
				maxImgHeight: 620,
				minImgHeight: 500,
				bookingPage: {
					url: "https://www.easy-booking.at/bookingengine2/#11803/2/2107-3738-2369/category/12",
					style: "content"
				},
				enquiryPage: {
					url: "https://www.easy-booking.at/bookingengine2/#11803/2/2107-3738-2369/category/12",
					style: "content"
				},
				showAvailability: true,
				showPrices: true,
				showDetails: true,
				showDescription: true,
				showPlan: true,
				category: 5,
				roomLevel: false,
				room: "all",
				roomSorting: "random",
				showFilter: false,
				locales: [{
					de: {
						for: "für",
						persons: "Personen",
						from: "ab",
						perPerson: "pro Person",
						description: "Beschreibung",
						details: "Ausstattung",
						price: "Preise",
						availability: "Kalender",
						layout: "Grundriss",
						request: "Anfragen",
						booking: "Buchen",
						allRooms: "Alle Zimmer"
					}
				}]
			});
			loadCategories(data);

			// --- Fix: nativen "Buchen"-Button abfangen und direkt zur Buchungsseite verlinken ---
			var bookingUrl = "https://www.easy-booking.at/bookingengine2/#11803/2/2107-3738-2369/category/5";
			var elapsed = 0;
			var interceptInterval = setInterval(function () {
				jQuery(".eb-categories a, .eb-categories button")
					.filter(function () {
						return jQuery.trim(jQuery(this).text()) === "Buchen";
					})
					.off("click.ebRedirect")
					.on("click.ebRedirect", function (e) {
						e.preventDefault();
						e.stopPropagation();
						window.open(bookingUrl, "_blank");
					});

				elapsed += 500;
				if (elapsed >= 8000) {
					clearInterval(interceptInterval);
				}
			}, 500);

		} else {
			setTimeout(ebCategoriesLoadedCheck, 200);
		}
	}
	ebCategoriesLoadedCheck();
</script>

</body>
</html>
